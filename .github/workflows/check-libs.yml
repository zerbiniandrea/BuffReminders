name: Check Library Updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Fetch latest libraries
        run: scripts/fetch-libs.sh

      - name: Check for updates
        id: diff
        run: |
          updated=""

          # Iterate every vendored lib folder and compare each file against its upstream
          # counterpart. Files we ship without an upstream copy (e.g. our hand-shipped
          # LGPL text for LibSharedMedia-3.0) are skipped naturally.
          for d in Libs/*/; do
            lib=$(basename "$d")
            changed=false
            for bundled in Libs/$lib/*; do
              [ -f "$bundled" ] || continue
              fname=$(basename "$bundled")
              if [ -f "/tmp/$lib/$fname" ] && ! diff -q "$bundled" "/tmp/$lib/$fname" > /dev/null 2>&1; then
                cp "/tmp/$lib/$fname" "$bundled"
                changed=true
              fi
            done
            if [ "$changed" = true ]; then
              updated="$updated $lib"
            fi
          done

          updated=$(echo "$updated" | xargs)
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Create PR if updates found
        id: pr
        if: steps.diff.outputs.updated != ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(libs): 📦 update embedded libs (${{ steps.diff.outputs.updated }})"
          title: "chore(libs): 📦 update embedded libs (${{ steps.diff.outputs.updated }})"
          body: |
            Automated weekly check found updates for: **${{ steps.diff.outputs.updated }}**

            Please review the diff to make sure nothing breaking changed.
          branch: chore/update-libs
          delete-branch: true

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_LIBS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATED: ${{ steps.diff.outputs.updated }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OP: ${{ steps.pr.outputs.pull-request-operation }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_LIBS_WEBHOOK_URL secret not set; skipping notification"
            exit 0
          fi

          case "$JOB_STATUS" in
            failure)
              content="check-libs failed: $RUN_URL"
              ;;
            cancelled)
              content="check-libs cancelled: $RUN_URL"
              ;;
            success)
              if [ -n "$UPDATED" ]; then
                content="check-libs: lib-update PR ${PR_OP:-opened} for ${UPDATED} -> ${PR_URL}"
              else
                content="check-libs: ran clean, no lib updates this week"
              fi
              ;;
            *)
              content="check-libs finished with status '$JOB_STATUS': $RUN_URL"
              ;;
          esac

          curl -sS -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$content" '{content: $c}')" \
            "$WEBHOOK"
