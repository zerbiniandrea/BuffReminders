name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Baseline is the previous stable tag (exclude pre-releases and the
          # tag being built, which already exists on a stable push).
          LAST_STABLE=$(git tag --sort=-v:refname | grep -vE 'alpha|beta|rc' | grep -vFx "$TAG" | head -1)
          RANGE="${LAST_STABLE:+${LAST_STABLE}..}HEAD"
          echo "Tag=$TAG  Baseline=${LAST_STABLE:-<none>}  Range=$RANGE"
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          # --ignore-tags folds the pre-release alphas into one section labeled
          # with the current tag, so every release lists all changes since the
          # last stable.
          "$RUNNER_TEMP/git-cliff-2.10.1/git-cliff" \
            --config cliff.toml \
            --ignore-tags '.*-alpha.*' \
            --tag "$TAG" \
            "$RANGE" \
            --output CHANGELOG.md
          echo "----- CHANGELOG.md -----"
          cat CHANGELOG.md

      - name: Package and Release
        uses: BigWigsMods/packager@v2.5.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CHANGELOG=$(gh release view "$TAG" --json body -q '.body' | sed 's/\r//g')
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | jq -Rs .)

          curl -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"BuffReminders $TAG Released\", \"description\": $CHANGELOG_ESCAPED, \"color\": 5814783, \"url\": \"https://github.com/zerbiniandrea/BuffReminders/releases/tag/$TAG\"}]}" \
            "$DISCORD_WEBHOOK"
