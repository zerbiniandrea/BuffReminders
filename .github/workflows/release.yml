name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(alpha|beta) ]]; then
            # A pre-release lists the changes since the previous tag on its history.
            # After a history rewrite, that is an older tag, so the range only grows.
            BASELINE=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            # A stable release lists every change since the previous stable tag.
            BASELINE=$(git tag --sort=-v:refname | grep -vE 'alpha|beta|rc' | grep -vFx "$TAG" | head -1)
          fi
          RANGE="${BASELINE:+${BASELINE}..}HEAD"
          echo "Tag=$TAG  Baseline=${BASELINE:-<none>}  Range=$RANGE"
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          # --ignore-tags folds the pre-releases (alpha, beta) inside the range into
          # one section labeled with the current tag.
          "$RUNNER_TEMP/git-cliff-2.10.1/git-cliff" \
            --config cliff.toml \
            --ignore-tags '.*-(alpha|beta).*' \
            --tag "$TAG" \
            "$RANGE" \
            --output CHANGELOG.md
          # Fixup commits are not in the changelog, so a pre-release can have no entries.
          if ! grep -q '^### ' CHANGELOG.md; then
            printf '\n- Fixes and improvements to the features of earlier pre-releases.\n' >> CHANGELOG.md
          fi
          echo "----- CHANGELOG.md -----"
          cat CHANGELOG.md

      - name: Package and Release
        uses: BigWigsMods/packager@v2.7.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CHANGELOG=$(gh release view "$TAG" --json body -q '.body' | sed 's/\r//g')
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | jq -Rs .)

          curl -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"BuffReminders $TAG Released\", \"description\": $CHANGELOG_ESCAPED, \"color\": 5814783, \"url\": \"https://github.com/zerbiniandrea/BuffReminders/releases/tag/$TAG\"}]}" \
            "$DISCORD_WEBHOOK"
