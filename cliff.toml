# git-cliff config: generates release notes from Conventional Commits.
#
# feat/fix/perf get their own sections. i18n collapses to one Localization line, and
# all other types collapse to one Other Changes line. Leading gitmoji are stripped,
# and only the subject renders (no bodies).
#
# Inside a section, entries for both clients come first. A scope "retail/<area>" or
# "forever/<area>" (or the bare client name) goes into a block for that client.
# A scope with one entry renders inline ("**Area:** ..."); a scope with more entries
# renders as a heading with nested entries. Scopeless entries come last.
#
# An annotated tag message renders as an intro above the sections. The workflow sets
# BASELINE (the previous tag of the range) for the compare link. The pre-release
# folding and the ranges live in .github/workflows/release.yml. .cliffignore lists
# the SHAs of commits to leave out.

[changelog]
header = "# BuffReminders\n"
body = """
{%- macro entries(commits, client, indent) -%}
{%- set_global prev = "" -%}
{%- for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
{%- if commit.scope and commit.scope != client -%}
{%- if client != "" -%}{%- set area = commit.scope | trim_start_matches(pat=client ~ "/") -%}{%- else -%}{%- set area = commit.scope -%}{%- endif -%}
{%- set count = commits | filter(attribute="scope", value=commit.scope) | length -%}
{%- if count == 1 %}
{{ indent }}- **{{ area | upper_first }}:** {{ commit.message }}
{%- else -%}
{%- if commit.scope != prev %}
{{ indent }}- **{{ area | upper_first }}:**
{%- set_global prev = commit.scope -%}
{%- endif %}
{{ indent }}  - {{ commit.message | upper_first }}
{%- endif -%}
{%- endif -%}
{%- endfor -%}
{%- for commit in commits -%}
{%- if not commit.scope or commit.scope == client %}
{{ indent }}- {{ commit.message | upper_first }}
{%- endif -%}
{%- endfor -%}
{%- endmacro entries -%}

## [{{ version }}](https://github.com/zerbiniandrea/BuffReminders/tree/{{ version }}){% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% set baseline = get_env(name="BASELINE", default="") -%}
{% if baseline != "" %}[Full Changelog](https://github.com/zerbiniandrea/BuffReminders/compare/{{ baseline }}...{{ version }}) {% endif %}[Previous Releases](https://github.com/zerbiniandrea/BuffReminders/releases)
{% if message %}
{{ message | trim }}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last }}
{% if group is containing("Localization") -%}
{%- set_global langs = "" -%}
{%- for commit in commits -%}
{%- if commit.scope and commit.scope not in langs %}{% set_global langs = langs ~ commit.scope ~ ", " %}{% endif -%}
{%- endfor %}
- Updated translations{% if langs != "" %}: {{ langs | trim_end_matches(pat=", ") }}{% endif %}
{% elif group is containing("Other Changes") %}
- {{ commits | length }} internal change{% if commits | length > 1 %}s{% endif %} (code cleanup, build and docs). The full changelog lists each one.
{% else -%}
{%- set_global shared = [] -%}
{%- set_global retail = [] -%}
{%- set_global forever = [] -%}
{%- for commit in commits -%}
{%- set head = commit.scope | default(value="") | split(pat="/") | first -%}
{%- if head == "retail" -%}{%- set_global retail = retail | concat(with=commit) -%}
{%- elif head == "forever" -%}{%- set_global forever = forever | concat(with=commit) -%}
{%- else -%}{%- set_global shared = shared | concat(with=commit) -%}
{%- endif -%}
{%- endfor -%}
{{ self::entries(commits=shared, client="", indent="") }}
{%- if retail | length > 0 %}
- **Retail:**
{{- self::entries(commits=retail, client="retail", indent="  ") }}
{%- endif -%}
{%- if forever | length > 0 %}
- **WoW Forever:**
{{- self::entries(commits=forever, client="forever", indent="  ") }}
{%- endif %}
{% endif -%}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Strip leading gitmoji + variation selectors, then tidy whitespace.
commit_preprocessors = [
  { pattern = "[\\x{1F000}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{2190}-\\x{21FF}\\x{2300}-\\x{23FF}\\x{FE0F}\\x{200D}]", replace = "" },
  { pattern = "  +", replace = " " },
  { pattern = "^ +", replace = "" },
]

# HTML-comment sort keys order the sections; the template strips them so they
# never render. The final catch-all routes everything else to Other Changes.
commit_parsers = [
  { footer = "^(?i)changelog: ?skip", skip = true },
  # v7.0.0: WoW Forever commits from before the client scope rule. Delete after the release.
  { sha = "9b5f14848c3d638aa401da9cac5760fc55e5e365", scope = "forever/mage armor", group = "<!-- 0 -->New Features ✨" },
  { sha = "b99d4355ea78b0bcc7152b8dcb20201927d5dfa7", scope = "forever/sleeping bag", group = "<!-- 0 -->New Features ✨" },
  { sha = "efdd3ee020c372e921f47629703000facdecd7f4", scope = "forever/tracking", group = "<!-- 0 -->New Features ✨" },
  { message = "^feat", group = "<!-- 0 -->New Features ✨" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes 🐛" },
  { message = "^perf", group = "<!-- 2 -->Performance ⚡️" },
  { message = "^i18n", group = "<!-- 3 -->Localization 🌐" },
  { message = ".*", group = "<!-- 4 -->Other Changes 🔧" },
]

filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
