# git-cliff config — generates release notes from Conventional Commits.
#
# Only feat/fix/perf reach the changelog; refactor/style/chore/i18n/etc. are
# dropped. Leading gitmoji are stripped from each line; commit bodies render as
# an indented user-facing description. Sections are ordered features -> fixes ->
# perf via HTML-comment sort keys that the template strips before rendering.
#
# The alpha-folding and release range live in .github/workflows/release.yml
# (--ignore-tags + an explicit <last-stable>..HEAD range), NOT here, so every
# release shows all meaningful changes since the last stable, labeled with its
# own tag.

[changelog]
header = ""
body = """
{% if version %}## {{ version }}{% if timestamp %} — {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- if commit.body and commit.body | trim != "" %}
{{ commit.body | trim | indent(prefix="  ", first=true) }}
{%- endif %}
{%- endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Strip leading gitmoji + variation selectors, then tidy whitespace.
commit_preprocessors = [
  { pattern = "[\\x{1F000}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{2190}-\\x{21FF}\\x{2300}-\\x{23FF}\\x{FE0F}\\x{200D}]", replace = "" },
  { pattern = "  +", replace = " " },
  { pattern = "^ +", replace = "" },
]

# HTML-comment sort keys order the sections; the template strips them so they
# never render. Anything not matched below is dropped from the changelog.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ New Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡️ Performance" },
  { message = ".*", skip = true },
]

filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
